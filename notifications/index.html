<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — Analytica</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0A1628; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; }
a { text-decoration: none; color: inherit; }

.topnav { position: fixed; top: 0; left: 0; right: 0; height: 58px; background: rgba(10,22,40,0.98); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; padding: 0 20px; gap: 12px; z-index: 100; }
.nav-logo { font-size: 18px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
.nav-logo span { color: #F5A623; }
.nav-right { margin-left: auto; display: flex; gap: 8px; }
.btn { padding: 7px 16px; border-radius: 7px; font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; border: none; transition: all 0.15s; display: inline-block; }
.btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,0.15) !important; color: rgba(255,255,255,0.7); }
.btn-ghost:hover { color: #fff; }
.btn-primary { background: #F5A623; color: #0A1628; font-weight: 700; }
.btn-primary:hover { background: #f0b84a; }

.page { margin-top: 58px; max-width: 700px; margin-left: auto; margin-right: auto; padding: 28px 20px 60px; }

.page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
.page-title { font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }
.page-sub { font-size: 13px; color: rgba(255,255,255,0.35); margin-top: 2px; }
.mark-all-btn { font-size: 12px; color: #F5A623; cursor: pointer; font-weight: 600; background: none; border: none; font-family: 'Inter', sans-serif; }
.mark-all-btn:hover { text-decoration: underline; }

.filters-row { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.filter-pill { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: rgba(255,255,255,0.4); transition: all 0.15s; font-family: 'Inter', sans-serif; }
.filter-pill:hover, .filter-pill.active { background: rgba(245,166,35,0.08); border-color: rgba(245,166,35,0.3); color: #F5A623; }

.notif-list { display: flex; flex-direction: column; gap: 2px; }
.notif-card { display: flex; gap: 12px; padding: 14px; border-radius: 10px; cursor: pointer; transition: all 0.15s; border: 1px solid transparent; }
.notif-card:hover { background: rgba(255,255,255,0.03); }
.notif-card.unread { background: rgba(245,166,35,0.04); border-color: rgba(245,166,35,0.1); }
.notif-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
.ni-job { background: rgba(41,128,185,0.12); }
.ni-collab { background: rgba(39,174,96,0.12); }
.ni-community { background: rgba(142,68,173,0.12); }
.ni-badge { background: rgba(245,166,35,0.12); }
.ni-mentor { background: rgba(231,76,60,0.12); }
.ni-system { background: rgba(255,255,255,0.06); }
.notif-body { flex: 1; min-width: 0; }
.notif-title { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.notif-message { font-size: 12px; color: rgba(255,255,255,0.45); line-height: 1.5; }
.notif-time { font-size: 11px; color: rgba(255,255,255,0.25); margin-top: 5px; }
.unread-dot { width: 7px; height: 7px; background: #F5A623; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }

.empty-state { text-align: center; padding: 60px 20px; }
.empty-icon { font-size: 44px; margin-bottom: 14px; }
.empty-state h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
.empty-state p { font-size: 13px; color: rgba(255,255,255,0.35); }

.loading { text-align: center; padding: 60px 20px; color: rgba(255,255,255,0.3); }

.toast { position: fixed; bottom: 20px; right: 20px; padding: 11px 18px; border-radius: 8px; font-size: 13px; font-weight: 500; color: #fff; z-index: 999; animation: slideUp 0.25s ease; }
.toast-success { background: #27AE60; }
.toast-info { background: #2980B9; }
@keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>

<nav class="topnav">
  <a href="../index.html" class="nav-logo">Analytica<span>.</span></a>
  <div class="nav-right" id="topnav-right">
    <a href="../dashboard/index.html" class="btn btn-ghost">Dashboard</a>
  </div>
</nav>

<div class="page">

  <div class="page-header">
    <div>
      <div class="page-title">🔔 Notifications</div>
      <div class="page-sub" id="notif-count-sub">Loading...</div>
    </div>
    <button class="mark-all-btn" onclick="markAllRead()">Mark all as read</button>
  </div>

  <div class="filters-row">
    <button class="filter-pill active" onclick="setFilter('all', this)">All</button>
    <button class="filter-pill" onclick="setFilter('unread', this)">Unread</button>
    <button class="filter-pill" onclick="setFilter('job', this)">Jobs</button>
    <button class="filter-pill" onclick="setFilter('collab', this)">Collab</button>
    <button class="filter-pill" onclick="setFilter('community', this)">Community</button>
    <button class="filter-pill" onclick="setFilter('badge', this)">Badges</button>
  </div>

  <div id="notif-list" class="notif-list">
    <div class="loading">Loading notifications...</div>
  </div>

</div>

<script src="../js/supabase.js"></script>
<script>
let allNotifs = []
let currentFilter = 'all'
let currentUserId = null

const ICON_MAP = {
  job: { icon: '💼', class: 'ni-job' },
  collab: { icon: '🤝', class: 'ni-collab' },
  community: { icon: '🗣️', class: 'ni-community' },
  badge: { icon: '🏆', class: 'ni-badge' },
  mentorship: { icon: '🎓', class: 'ni-mentor' },
  system: { icon: '🔔', class: 'ni-system' }
}

async function loadNotifications() {
  const user = await requireAuth()
  if (!user) return
  currentUserId = user.id

  const { data, error } = await db
    .from('notifications')
    .select('*')
    .eq('user_id', user.id)
    .order('created_at', { ascending: false })

  if (error) {
    document.getElementById('notif-list').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><h3>Couldn't load notifications</h3><p>Please try refreshing the page</p></div>`
    return
  }

  allNotifs = data || []
  renderNotifs()
}

function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr).getTime()
  const mins = Math.floor(diff / 60000)
  if (mins < 1) return 'Just now'
  if (mins < 60) return `${mins}m ago`
  const hrs = Math.floor(mins / 60)
  if (hrs < 24) return `${hrs}h ago`
  const days = Math.floor(hrs / 24)
  if (days < 7) return `${days}d ago`
  return new Date(dateStr).toLocaleDateString()
}

function renderNotifs() {
  let list = allNotifs.filter(n => {
    if (currentFilter === 'all') return true
    if (currentFilter === 'unread') return !n.is_read
    return n.type === currentFilter
  })

  const unreadCount = allNotifs.filter(n => !n.is_read).length
  document.getElementById('notif-count-sub').textContent =
    unreadCount > 0 ? `${unreadCount} unread notification${unreadCount !== 1 ? 's' : ''}` : 'You\'re all caught up'

  const container = document.getElementById('notif-list')

  if (!list.length) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔔</div>
        <h3>No notifications</h3>
        <p>${currentFilter === 'all' ? 'You don\'t have any notifications yet' : 'Nothing here for this filter'}</p>
      </div>`
    return
  }

  container.innerHTML = list.map(n => {
    const iconInfo = ICON_MAP[n.type] || ICON_MAP.system
    return `
      <div class="notif-card ${n.is_read ? '' : 'unread'}" onclick="handleNotifClick(${n.id}, '${n.link || ''}')">
        <div class="notif-icon ${iconInfo.class}">${iconInfo.icon}</div>
        <div class="notif-body">
          <div class="notif-title">${n.title}</div>
          ${n.message ? `<div class="notif-message">${n.message}</div>` : ''}
          <div class="notif-time">${timeAgo(n.created_at)}</div>
        </div>
        ${n.is_read ? '' : '<div class="unread-dot"></div>'}
      </div>`
  }).join('')
}

function setFilter(filter, btn) {
  currentFilter = filter
  document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'))
  btn.classList.add('active')
  renderNotifs()
}

async function handleNotifClick(id, link) {
  const notif = allNotifs.find(n => n.id === id)
  if (notif && !notif.is_read) {
    await db.from('notifications').update({ is_read: true }).eq('id', id)
    notif.is_read = true
    renderNotifs()
  }
  if (link) window.location.href = link
}

async function markAllRead() {
  const unreadIds = allNotifs.filter(n => !n.is_read).map(n => n.id)
  if (!unreadIds.length) {
    showToast('All caught up already!', 'info')
    return
  }
  await db.from('notifications').update({ is_read: true }).eq('user_id', currentUserId).eq('is_read', false)
  allNotifs.forEach(n => n.is_read = true)
  renderNotifs()
  showToast('✓ All notifications marked as read', 'success')
}

function showToast(msg, type = 'success') {
  const t = document.createElement('div')
  t.className = `toast toast-${type}`
  t.textContent = msg
  document.body.appendChild(t)
  setTimeout(() => t.remove(), 3000)
}

loadNotifications()
</script>
</body>
</html>
