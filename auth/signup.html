<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Analytica</title>
<link rel="stylesheet" href="../css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: #0A1628;
  position: relative;
  overflow: hidden;
}

/* Background grid */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(245,166,35,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(245,166,35,0.04) 1px, transparent 1px);
  background-size: 50px 50px;
  pointer-events: none;
}

/* Orbs */
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(70px);
  pointer-events: none;
}
.orb-1 { width:300px; height:300px; background:rgba(245,166,35,0.08); top:-80px; right:-80px; }
.orb-2 { width:250px; height:250px; background:rgba(26,58,107,0.5); bottom:-60px; left:-60px; }

/* Card */
.auth-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 40px 32px;
  width: 100%;
  max-width: 440px;
  position: relative;
  z-index: 2;
}

/* Logo */
.auth-logo {
  font-family: 'Playfair Display', serif;
  font-size: 24px;
  font-weight: 900;
  color: #fff;
  text-align: center;
  margin-bottom: 8px;
  display: block;
  text-decoration: none;
}
.auth-logo span { color: #F5A623; }

.auth-tagline {
  text-align: center;
  font-size: 13px;
  color: rgba(255,255,255,0.4);
  margin-bottom: 32px;
}

.auth-title {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 6px;
}

.auth-sub {
  text-align: center;
  font-size: 13px;
  color: rgba(255,255,255,0.45);
  margin-bottom: 28px;
}

/* Form */
.form-group { margin-bottom: 18px; }

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,0.7);
  margin-bottom: 7px;
}

input, select {
  width: 100%;
  padding: 12px 16px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  outline: none;
  transition: border-color 0.2s;
}

input:focus, select:focus {
  border-color: #F5A623;
  background: rgba(255,255,255,0.08);
}

input::placeholder { color: rgba(255,255,255,0.25); }

select option { background: #112240; color: #fff; }

/* Submit button */
.btn-submit {
  width: 100%;
  padding: 14px;
  background: #F5A623;
  border: none;
  border-radius: 8px;
  color: #0A1628;
  font-size: 15px;
  font-weight: 700;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 8px;
}
.btn-submit:hover { background: #FFD07A; transform: translateY(-1px); }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

/* Divider */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 20px 0;
}
.divider-line { flex: 1; height: 1px; background: rgba(255,255,255,0.08); }
.divider-text { font-size: 12px; color: rgba(255,255,255,0.3); }

/* Google button */
.btn-google {
  width: 100%;
  padding: 13px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.btn-google:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.2); }

/* Terms */
.terms {
  font-size: 12px;
  color: rgba(255,255,255,0.3);
  text-align: center;
  margin-top: 16px;
  line-height: 1.6;
}
.terms a { color: #F5A623; }

/* Login link */
.login-link {
  text-align: center;
  font-size: 13px;
  color: rgba(255,255,255,0.45);
  margin-top: 20px;
}
.login-link a { color: #F5A623; font-weight: 600; }

/* Alert */
.alert {
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 18px;
  display: none;
}
.alert.error { background: rgba(231,76,60,0.15); border: 1px solid rgba(231,76,60,0.3); color: #ff6b6b; }
.alert.success { background: rgba(39,174,96,0.15); border: 1px solid rgba(39,174,96,0.3); color: #2ecc71; }
.alert.show { display: block; }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="auth-card">

  <a href="../index.html" class="auth-logo">Analytica<span>.</span></a>
<p class="auth-tagline">Where Tech People Connect & Build</p>
<p class="auth-sub">Join 120,000+ tech people worldwide</p>

  <!-- Alert box -->
  <div class="alert" id="alert"></div>

  <!-- Form -->
  <form id="signup-form">

    <div class="form-row">
      <div class="form-group">
        <label for="firstname">First Name</label>
        <input type="text" id="firstname" placeholder="Ayomide" required>
      </div>
      <div class="form-group">
        <label for="lastname">Last Name</label>
        <input type="text" id="lastname" placeholder="Akingboye" required>
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Min. 8 characters" required>
    </div>

    <div class="form-group">
      <label for="country">Country</label>
      <select id="country" required>
        <option value="">Select your country</option>
        <option value="Nigeria">🇳🇬 Nigeria</option>
        <option value="Ghana">🇬🇭 Ghana</option>
        <option value="Kenya">🇰🇪 Kenya</option>
        <option value="South Africa">🇿🇦 South Africa</option>
        <option value="Ethiopia">🇪🇹 Ethiopia</option>
        <option value="Tanzania">🇹🇿 Tanzania</option>
        <option value="Uganda">🇺🇬 Uganda</option>
        <option value="Rwanda">🇷🇼 Rwanda</option>
        <option value="Cameroon">🇨🇲 Cameroon</option>
        <option value="Other">🌍 Other African Country</option>
      </select>
    </div>

    <div class="form-group">
      <label for="role">I am a</label>
      <select id="role" required>
        <option value="">Select your role</option>
        <option value="student">📚 Student / Beginner</option>
        <option value="analyst">📊 Data Analyst</option>
        <option value="engineer">⚙️ Data Engineer</option>
        <option value="scientist">🔬 Data Scientist</option>
        <option value="teacher">🎓 Teacher / Trainer</option>
        <option value="recruiter">💼 Recruiter / HR</option>
        <option value="other">🙂 Other</option>
      </select>
    </div>

    <button type="submit" class="btn-submit" id="submit-btn">
      Create My Account →
    </button>

  </form>

  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-text">or</span>
    <div class="divider-line"></div>
  </div>

  <button class="btn-google" id="google-btn">
    <svg width="18" height="18" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Continue with Google
  </button>

  <p class="terms">
    By signing up you agree to our
    <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
  </p>

  <p class="login-link">
    Already have an account? <a href="login.html">Log In</a>
  </p>

</div>


<script src="../js/supabase.js"></script>
<script>
const form = document.getElementById('signup-form')
const alertBox = document.getElementById('alert')
const submitBtn = document.getElementById('submit-btn')

function showAlert(message, type) {
  alertBox.textContent = message
  alertBox.className = `alert ${type} show`
}

form.addEventListener('submit', async (e) => {
  e.preventDefault()

  const firstname = document.getElementById('firstname').value.trim()
  const lastname  = document.getElementById('lastname').value.trim()
  const email     = document.getElementById('email').value.trim()
  const password  = document.getElementById('password').value
  const country   = document.getElementById('country').value
  const role      = document.getElementById('role').value

  // Basic validation
  if (password.length < 8) {
    showAlert('Password must be at least 8 characters.', 'error')
    return
  }

  // Disable button
  submitBtn.disabled = true
  submitBtn.textContent = 'Creating account...'

  // Sign up with Supabase
  const { data, error } = await db.auth.signUp({
    email,
    password,
    options: {
      data: {
        first_name: firstname,
        last_name: lastname,
        full_name: `${firstname} ${lastname}`,
        country,
        role
      }
    }
  })

  if (error) {
    showAlert(error.message, 'error')
    submitBtn.disabled = false
    submitBtn.textContent = 'Create My Account →'
    return
  }

  // Success
  showAlert('Account created! Check your email to verify your account.', 'success')
  submitBtn.textContent = 'Account Created ✓'

  // Redirect after 2 seconds
  setTimeout(() => {
    window.location.href = '/dashboard/index.html'
  }, 2000)
})

// Google sign up
document.getElementById('google-btn').addEventListener('click', async () => {
  const { error } = await db.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/dashboard/index.html' }
  })
  if (error) showAlert(error.message, 'error')
})
</script>

</body>
</html>
