<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Data Assistant — Analytica</title>
<link rel="stylesheet" href="../css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; }
body { background: #0A1628; min-height: 100vh; margin: 0; }

.topnav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 60px;
  background: rgba(10,22,40,0.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 40;
}
.topnav-logo {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  font-weight: 900;
  color: #fff;
  text-decoration: none;
}
.topnav-logo span { color: #F5A623; }
.topnav-right { display: flex; gap: 10px; }
.btn-sm {
  padding: 7px 16px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s;
  border: none;
}
.btn-gold { background: #F5A623; color: #0A1628; }
.btn-gold:hover { background: #FFD07A; }
.btn-outline {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.2) !important;
  color: #fff;
}

/* ── CHAT LAYOUT ── */
.chat-layout {
  display: flex;
  flex-direction: column;
  height: 100vh;
  padding-top: 60px;
}

/* ── SIDEBAR ── */
.chat-sidebar {
  display: none;
  width: 260px;
  background: #0d1f3c;
  border-right: 1px solid rgba(255,255,255,0.06);
  flex-direction: column;
  flex-shrink: 0;
}

.sidebar-header {
  padding: 20px 16px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.sidebar-title {
  font-size: 13px;
  font-weight: 600;
  color: rgba(255,255,255,0.5);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.btn-new-chat {
  width: 100%;
  padding: 10px;
  background: rgba(245,166,35,0.1);
  border: 1px solid rgba(245,166,35,0.25);
  border-radius: 8px;
  color: #F5A623;
  font-size: 13px;
  font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-new-chat:hover { background: rgba(245,166,35,0.2); }

.chat-history { flex: 1; overflow-y: auto; padding: 12px; }
.history-item {
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  transition: all 0.2s;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.history-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.history-item.active { background: rgba(245,166,35,0.1); color: #F5A623; }

/* ── MAIN CHAT ── */
.chat-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Chat header */
.chat-header {
  padding: 16px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(10,22,40,0.5);
}
.chat-header-left { display: flex; align-items: center; gap: 12px; }
.ai-avatar {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #F5A623, #e8920f);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.ai-name { font-size: 15px; font-weight: 600; }
.ai-status {
  font-size: 11px;
  color: #27AE60;
  display: flex;
  align-items: center;
  gap: 4px;
}
.status-dot {
  width: 6px; height: 6px;
  background: #27AE60;
  border-radius: 50%;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%,100% { opacity:1; transform:scale(1); }
  50% { opacity:0.4; transform:scale(1.3); }
}
.btn-clear-chat {
  padding: 6px 14px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px;
  color: rgba(255,255,255,0.4);
  font-size: 12px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-clear-chat:hover { border-color: rgba(231,76,60,0.3); color: #e74c3c; }

/* Messages area */
.messages-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.messages-area::-webkit-scrollbar { width: 4px; }
.messages-area::-webkit-scrollbar-track { background: transparent; }
.messages-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

/* Welcome screen */
.welcome-screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  text-align: center;
}
.welcome-icon { font-size: 52px; margin-bottom: 16px; }
.welcome-title {
  font-family: 'Playfair Display', serif;
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 10px;
}
.welcome-title span { color: #F5A623; }
.welcome-sub {
  font-size: 14px;
  color: rgba(255,255,255,0.45);
  margin-bottom: 28px;
  max-width: 400px;
  line-height: 1.7;
}

/* Suggestion chips */
.suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  max-width: 600px;
}
.suggestion-chip {
  padding: 8px 16px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 100px;
  font-size: 13px;
  color: rgba(255,255,255,0.6);
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'DM Sans', sans-serif;
  text-align: left;
}
.suggestion-chip:hover {
  background: rgba(245,166,35,0.08);
  border-color: rgba(245,166,35,0.25);
  color: #F5A623;
}

/* Message bubbles */
.message {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  animation: fadeUp 0.3s ease;
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(8px); }
  to { opacity:1; transform:translateY(0); }
}
.message.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 32px; height: 32px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.msg-avatar.ai { background: linear-gradient(135deg, #F5A623, #e8920f); }
.msg-avatar.user { background: linear-gradient(135deg, #1a3a6b, #3498db); font-weight:700; color:#fff; font-size:13px; }

.msg-bubble {
  max-width: 80%;
  padding: 12px 16px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.7;
}
.msg-bubble.ai {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.85);
  border-top-left-radius: 4px;
}
.msg-bubble.user {
  background: linear-gradient(135deg, rgba(245,166,35,0.15), rgba(245,166,35,0.08));
  border: 1px solid rgba(245,166,35,0.2);
  color: rgba(255,255,255,0.9);
  border-top-right-radius: 4px;
}

/* Code blocks inside messages */
.msg-bubble pre {
  background: #0d1f3c;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  padding: 12px;
  overflow-x: auto;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  color: #F5A623;
  margin: 10px 0;
  line-height: 1.6;
}
.msg-bubble code {
  background: rgba(245,166,35,0.1);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  color: #F5A623;
}
.msg-bubble strong { color: #fff; }
.msg-bubble ul, .msg-bubble ol {
  padding-left: 20px;
  margin: 8px 0;
}
.msg-bubble li { margin-bottom: 4px; }

/* Copy button */
.msg-actions {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}
.btn-copy-msg {
  padding: 4px 10px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 6px;
  color: rgba(255,255,255,0.35);
  font-size: 11px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-copy-msg:hover { color: #F5A623; border-color: rgba(245,166,35,0.2); }

/* Typing indicator */
.typing-indicator {
  display: none;
  align-items: center;
  gap: 12px;
}
.typing-indicator.show { display: flex; }
.typing-dots {
  display: flex;
  gap: 4px;
  padding: 12px 16px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  border-top-left-radius: 4px;
}
.dot {
  width: 6px; height: 6px;
  background: rgba(255,255,255,0.4);
  border-radius: 50%;
  animation: bounce 1.4s infinite;
}
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
  0%,80%,100% { transform: translateY(0); opacity:0.4; }
  40% { transform: translateY(-6px); opacity:1; }
}

/* ── INPUT AREA ── */
.input-area {
  padding: 16px 20px;
  border-top: 1px solid rgba(255,255,255,0.06);
  background: rgba(10,22,40,0.8);
}
.input-wrap {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px;
  padding: 10px 14px;
  transition: border-color 0.2s;
}
.input-wrap:focus-within { border-color: rgba(245,166,35,0.3); }
#chat-input {
  flex: 1;
  background: transparent;
  border: none;
  color: #fff;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  outline: none;
  resize: none;
  max-height: 120px;
  min-height: 22px;
  line-height: 1.5;
}
#chat-input::placeholder { color: rgba(255,255,255,0.3); }
.btn-send {
  width: 36px; height: 36px;
  background: #F5A623;
  border: none;
  border-radius: 8px;
  color: #0A1628;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}
.btn-send:hover { background: #FFD07A; }
.btn-send:disabled { opacity: 0.4; cursor: not-allowed; }

.input-hint {
  font-size: 11px;
  color: rgba(255,255,255,0.2);
  text-align: center;
  margin-top: 8px;
}

/* Pro gate */
.pro-gate {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 24px;
  text-align: center;
}
.pro-gate.show { display: flex; }
.pro-gate-icon { font-size: 48px; margin-bottom: 16px; }
.pro-gate-title {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 10px;
}
.pro-gate-desc {
  font-size: 14px;
  color: rgba(255,255,255,0.45);
  margin-bottom: 24px;
  line-height: 1.7;
  max-width: 360px;
}

@media (min-width: 900px) {
  .chat-layout { flex-direction: row; }
  .chat-sidebar { display: flex; }
}
</style>
</head>
<body>

<div class="topnav">
  <a href="../index.html" class="topnav-logo">Analytica<span>.</span></a>
  <div class="topnav-right" id="topnav-right">
    <a href="../dashboard/index.html" class="btn-sm btn-outline">Dashboard</a>
    <a href="../auth/signup.html" class="btn-sm btn-gold">Join Free</a>
  </div>
</div>

<div class="chat-layout">

  <!-- Sidebar -->
  <div class="chat-sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">💬 Chat History</div>
      <button class="btn-new-chat" onclick="newChat()">+ New Chat</button>
    </div>
    <div class="chat-history" id="chat-history">
      <div class="history-item active">Welcome Chat</div>
    </div>
  </div>

  <!-- Main Chat -->
  <div class="chat-main">

    <!-- Header -->
    <div class="chat-header">
      <div class="chat-header-left">
        <div class="ai-avatar">🤖</div>
        <div>
          <div class="ai-name">Analytica AI</div>
          <div class="ai-status">
            <div class="status-dot"></div>
            Ready to help
          </div>
        </div>
      </div>
      <button class="btn-clear-chat" onclick="clearChat()">🗑️ Clear</button>
    </div>

    <!-- Messages -->
    <div class="messages-area" id="messages-area">

      <!-- Welcome Screen -->
      <div class="welcome-screen" id="welcome-screen">
        <div class="welcome-icon">🤖</div>
        <div class="welcome-title">Analytica <span>AI Assistant</span></div>
        <p class="welcome-sub">Ask me anything about data analysis, SQL, Excel, Python, Power BI or your career. I'm here to help!</p>
        <div class="suggestions">
          <button class="suggestion-chip" onclick="sendSuggestion(this)">📊 How do I remove duplicates in SQL?</button>
          <button class="suggestion-chip" onclick="sendSuggestion(this)">🐍 Write a Python script to clean my CSV</button>
          <button class="suggestion-chip" onclick="sendSuggestion(this)">📈 What chart type should I use for trends?</button>
          <button class="suggestion-chip" onclick="sendSuggestion(this)">🔍 Explain VLOOKUP vs XLOOKUP</button>
          <button class="suggestion-chip" onclick="sendSuggestion(this)">💼 How do I become a data analyst in Nigeria?</button>
          <button class="suggestion-chip" onclick="sendSuggestion(this)">🗄️ Write a SQL query to find top 10 customers</button>
        </div>
      </div>

    </div>

    <!-- Typing Indicator -->
    <div class="typing-indicator" id="typing-indicator" style="padding:0 20px 8px;">
      <div class="msg-avatar ai">🤖</div>
      <div class="typing-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-wrap">
        <textarea
          id="chat-input"
          placeholder="Ask anything about data analysis..."
          rows="1"
          onkeydown="handleKeydown(event)"
          oninput="autoResize(this)">
        </textarea>
        <button class="btn-send" id="send-btn" onclick="sendMessage()">➤</button>
      </div>
      <div class="input-hint">Press Enter to send · Shift+Enter for new line</div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script>
let messages = []
let isLoading = false
let currentUser = null
let userInitial = 'A'

// ── SYSTEM PROMPT ──
const SYSTEM_PROMPT = `You are Analytica AI, an expert data analytics assistant built specifically for African data analysts and students.

You help with:
- SQL queries (PostgreSQL, MySQL, SQLite)
- Excel formulas and techniques
- Python for data analysis (pandas, numpy, matplotlib, seaborn)
- Power BI and DAX
- Data cleaning and preparation
- Chart and visualization recommendations
- Career advice for data analysts in Nigeria and Africa
- Interpreting Nigerian datasets (NBS, CBN, WAEC data etc.)

Your style:
- Clear, practical and educational
- Use code examples when helpful
- Format code in code blocks
- Be encouraging especially to beginners
- Reference Nigerian/African context where relevant
- Keep responses concise but complete

You are part of the Analytica platform — Africa's #1 data intelligence platform.`

async function init() {
  const { data: { session } } = await db.auth.getSession()
  if (!session) {
    window.location.href = '../auth/login.html'
    return
  }

  // Check Pro plan
  const meta = session.user.user_metadata || {}
  if (meta.plan !== 'pro') {
    document.querySelector('.chat-main').innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;
      justify-content:center;height:100%;padding:40px 24px;text-align:center;">
        <div style="font-size:52px;margin-bottom:16px;">🔒</div>
        <div style="font-family:'Playfair Display',serif;font-size:22px;
        font-weight:700;margin-bottom:10px;">Pro Feature</div>
        <p style="font-size:14px;color:rgba(255,255,255,0.5);margin-bottom:24px;
        max-width:320px;line-height:1.7;">
          The AI Data Assistant is available on the Pro plan only.
          Upgrade for just ₦2,500/month.
        </p>
        <a href="../payment/index.html"
          style="padding:14px 32px;background:#F5A623;border:none;border-radius:8px;
          color:#0A1628;font-size:15px;font-weight:700;text-decoration:none;
          font-family:'DM Sans',sans-serif;">
          Upgrade to Pro →
        </a>
        <a href="../dashboard/index.html"
          style="margin-top:14px;font-size:13px;color:rgba(255,255,255,0.4);
          text-decoration:none;">← Back to Dashboard</a>
      </div>
    `
    return
  }

  // rest of init...
  currentUser = session.user


// ── INIT ──
async function init() {
  const { data: { session } } = await db.auth.getSession()
  if (session) {
    currentUser = session.user
    const meta = currentUser.user_metadata || {}
    const name = meta.first_name || currentUser.email.split('@')[0]
    userInitial = name[0].toUpperCase()

    document.getElementById('topnav-right').innerHTML = `
      <a href="../dashboard/index.html" class="btn-sm btn-outline">Dashboard</a>
      <div onclick="window.location.href='../dashboard/index.html'"
        style="width:34px;height:34px;background:linear-gradient(135deg,#F5A623,#e8920f);
        border-radius:50%;display:flex;align-items:center;justify-content:center;
        font-size:14px;font-weight:700;color:#0A1628;cursor:pointer;">
        ${userInitial}
      </div>
    `
  }
}

// ── SEND MESSAGE ──
async function sendMessage(text) {
  const input = document.getElementById('chat-input')
  const msg = text || input.value.trim()
  if (!msg || isLoading) return

  input.value = ''
  autoResize(input)

  // Hide welcome screen
  document.getElementById('welcome-screen').style.display = 'none'

  // Add user message
  addMessage('user', msg)
  messages.push({ role: 'user', content: msg })

  // Show typing
  isLoading = true
  document.getElementById('send-btn').disabled = true
  document.getElementById('typing-indicator').classList.add('show')

  // Scroll to bottom
  scrollToBottom()

  try {
    const response = await fetch('/api/chat', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({
    messages: messages,
    system: SYSTEM_PROMPT
  })
})

const data = await response.json()
const reply = data.reply || 'Sorry, try again.'
    // Hide typing
    document.getElementById('typing-indicator').classList.remove('show')

    // Add AI response
    addMessage('ai', reply)
    messages.push({ role: 'assistant', content: reply })

    // Update history
    updateHistory(msg)

  } catch (err) {
    document.getElementById('typing-indicator').classList.remove('show')
    addMessage('ai', '⚠️ Connection error. Please check your internet and try again.')
  }

  isLoading = false
  document.getElementById('send-btn').disabled = false
  scrollToBottom()
}

// ── ADD MESSAGE TO UI ──
function addMessage(role, text) {
  const area = document.getElementById('messages-area')
  const div = document.createElement('div')
  div.className = `message ${role}`

  const formattedText = formatMessage(text)

  div.innerHTML = `
    <div class="msg-avatar ${role}">${role === 'ai' ? '🤖' : userInitial}</div>
    <div>
      <div class="msg-bubble ${role}">${formattedText}</div>
      ${role === 'ai' ? `
        <div class="msg-actions">
          <button class="btn-copy-msg" onclick="copyMsg(this, \`${escapeBacktick(text)}\`)">📋 Copy</button>
        </div>
      ` : ''}
    </div>
  `
  area.appendChild(div)
  scrollToBottom()
}

// ── FORMAT MESSAGE (markdown-like) ──
function formatMessage(text) {
  return text
    .replace(/```(\w+)?\n?([\s\S]*?)```/g, '<pre>$2</pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/^### (.+)$/gm, '<strong>$1</strong>')
    .replace(/^## (.+)$/gm, '<strong style="font-size:15px;">$1</strong>')
    .replace(/^- (.+)$/gm, '• $1')
    .replace(/\n/g, '<br>')
}

// ── SEND SUGGESTION ──
function sendSuggestion(btn) {
  const text = btn.textContent.replace(/^[^\w]*/, '').trim()
  sendMessage(text)
}

// ── COPY MESSAGE ──
function copyMsg(btn, text) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✅ Copied!'
    setTimeout(() => btn.textContent = '📋 Copy', 2000)
  })
}

// ── CLEAR CHAT ──
function clearChat() {
  messages = []
  const area = document.getElementById('messages-area')
  area.innerHTML = `
    <div class="welcome-screen" id="welcome-screen">
      <div class="welcome-icon">🤖</div>
      <div class="welcome-title">Analytica <span style="color:#F5A623;">AI Assistant</span></div>
      <p class="welcome-sub">Ask me anything about data analysis, SQL, Excel, Python, Power BI or your career.</p>
      <div class="suggestions">
        <button class="suggestion-chip" onclick="sendSuggestion(this)">📊 How do I remove duplicates in SQL?</button>
        <button class="suggestion-chip" onclick="sendSuggestion(this)">🐍 Write a Python script to clean my CSV</button>
        <button class="suggestion-chip" onclick="sendSuggestion(this)">📈 What chart type should I use for trends?</button>
        <button class="suggestion-chip" onclick="sendSuggestion(this)">🔍 Explain VLOOKUP vs XLOOKUP</button>
        <button class="suggestion-chip" onclick="sendSuggestion(this)">💼 How do I become a data analyst in Nigeria?</button>
        <button class="suggestion-chip" onclick="sendSuggestion(this)">🗄️ Write a SQL query to find top 10 customers</button>
      </div>
    </div>
  `
}

// ── NEW CHAT ──
function newChat() {
  clearChat()
  const history = document.getElementById('chat-history')
  const items = history.querySelectorAll('.history-item')
  items.forEach(i => i.classList.remove('active'))
}

// ── UPDATE HISTORY ──
function updateHistory(msg) {
  const history = document.getElementById('chat-history')
  const existing = history.querySelector('.history-item.active')
  const preview = msg.length > 30 ? msg.substring(0, 30) + '...' : msg
  if (existing && existing.textContent === 'Welcome Chat') {
    existing.textContent = preview
  }
}

// ── SCROLL ──
function scrollToBottom() {
  const area = document.getElementById('messages-area')
  setTimeout(() => area.scrollTop = area.scrollHeight, 100)
}

// ── AUTO RESIZE TEXTAREA ──
function autoResize(el) {
  el.style.height = 'auto'
  el.style.height = Math.min(el.scrollHeight, 120) + 'px'
}

// ── KEYBOARD ──
function handleKeydown(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault()
    sendMessage()
  }
}

// ── HELPERS ──
function escapeBacktick(str) {
  return str.replace(/`/g, '\\`').replace(/\$/g, '\\$')
}

init()
</script>
