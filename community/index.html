<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Forum — Analytica</title>
<link rel="stylesheet" href="../css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { background: #0A1628; min-height: 100vh; }

/* ── TOP NAV ── */
.topnav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 60px;
  background: rgba(10,22,40,0.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 40;
}
.topnav-logo {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  font-weight: 900;
  color: #fff;
  text-decoration: none;
}
.topnav-logo span { color: #F5A623; }
.topnav-right { display: flex; gap: 10px; align-items: center; }
.btn-sm {
  padding: 7px 16px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s;
}
.btn-gold { background: #F5A623; color: #0A1628; border: none; }
.btn-gold:hover { background: #FFD07A; }
.btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff; }
.btn-outline:hover { border-color: #F5A623; color: #F5A623; }

/* ── PAGE LAYOUT ── */
.page { margin-top: 60px; padding: 28px 20px; max-width: 900px; margin-left: auto; margin-right: auto; }

/* ── PAGE HEADER ── */
.page-header { margin-bottom: 24px; }
.page-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(24px, 5vw, 36px);
  font-weight: 700;
  margin-bottom: 6px;
}
.page-title span { color: #F5A623; }
.page-sub { font-size: 14px; color: rgba(255,255,255,0.45); }

/* ── FORUM STATS ── */
.forum-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
.fstat {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 12px;
  padding: 14px;
  text-align: center;
}
.fstat-num {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  font-weight: 700;
  color: #F5A623;
}
.fstat-label { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

/* ── SEARCH & FILTER ── */
.forum-controls {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}
.search-box {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  padding: 10px 16px;
}
.search-box input {
  flex: 1;
  background: transparent;
  border: none;
  color: #fff;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  outline: none;
}
.search-box input::placeholder { color: rgba(255,255,255,0.3); }
.search-icon { font-size: 16px; color: rgba(255,255,255,0.3); }

.filter-tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.filter-tabs::-webkit-scrollbar { display: none; }
.tab {
  padding: 7px 16px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  border: 1px solid rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.5);
  background: transparent;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.2s;
}
.tab.active, .tab:hover {
  background: rgba(245,166,35,0.12);
  border-color: rgba(245,166,35,0.3);
  color: #F5A623;
}

/* ── ASK BUTTON ── */
.ask-btn-wrap { margin-bottom: 20px; }
.ask-btn {
  width: 100%;
  padding: 14px;
  background: #F5A623;
  border: none;
  border-radius: 10px;
  color: #0A1628;
  font-size: 15px;
  font-weight: 700;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.ask-btn:hover { background: #FFD07A; }

/* ── POST MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: #0d1f3c;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px 20px 0 0;
  padding: 28px 24px;
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.modal-title {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  font-weight: 700;
}
.modal-close {
  background: rgba(255,255,255,0.08);
  border: none;
  color: #fff;
  width: 32px; height: 32px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}
.modal label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,0.7);
  margin-bottom: 7px;
  margin-top: 16px;
}
.modal input, .modal textarea, .modal select {
  width: 100%;
  padding: 12px 16px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  outline: none;
  transition: border-color 0.2s;
}
.modal input:focus, .modal textarea:focus, .modal select:focus { border-color: #F5A623; }
.modal textarea { resize: vertical; min-height: 120px; }
.modal input::placeholder, .modal textarea::placeholder { color: rgba(255,255,255,0.25); }
.modal select option { background: #112240; }
.modal-submit {
  width: 100%;
  padding: 14px;
  background: #F5A623;
  border: none;
  border-radius: 8px;
  color: #0A1628;
  font-size: 15px;
  font-weight: 700;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  margin-top: 20px;
  transition: all 0.2s;
}
.modal-submit:hover { background: #FFD07A; }
.modal-submit:disabled { opacity: 0.6; cursor: not-allowed; }

/* ── POSTS LIST ── */
.posts-list { display: flex; flex-direction: column; gap: 12px; }

.post-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 14px;
  padding: 18px;
  cursor: pointer;
  transition: all 0.3s;
  text-decoration: none;
  display: block;
}
.post-card:hover {
  border-color: rgba(245,166,35,0.25);
  background: rgba(255,255,255,0.05);
  transform: translateY(-2px);
}

.post-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.post-tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid;
  white-space: nowrap;
}
.tag-sql { background: rgba(52,152,219,0.1); color: #3498db; border-color: rgba(52,152,219,0.3); }
.tag-excel { background: rgba(39,174,96,0.1); color: #27AE60; border-color: rgba(39,174,96,0.3); }
.tag-python { background: rgba(155,89,182,0.1); color: #9b59b6; border-color: rgba(155,89,182,0.3); }
.tag-powerbi { background: rgba(245,166,35,0.1); color: #F5A623; border-color: rgba(245,166,35,0.3); }
.tag-general { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5); border-color: rgba(255,255,255,0.1); }
.tag-career { background: rgba(231,76,60,0.1); color: #e74c3c; border-color: rgba(231,76,60,0.3); }

.post-time { font-size: 11px; color: rgba(255,255,255,0.3); white-space: nowrap; }

.post-title {
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 8px;
  line-height: 1.4;
}

.post-preview {
  font-size: 13px;
  color: rgba(255,255,255,0.4);
  line-height: 1.6;
  margin-bottom: 14px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.post-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.post-author {
  display: flex;
  align-items: center;
  gap: 8px;
}
.author-avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: linear-gradient(135deg, #F5A623, #e8920f);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: #0A1628;
}
.author-name { font-size: 12px; color: rgba(255,255,255,0.5); }

.post-meta {
  display: flex;
  align-items: center;
  gap: 14px;
}
.meta-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: rgba(255,255,255,0.35);
}

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center;
  padding: 60px 24px;
  color: rgba(255,255,255,0.3);
}
.empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; color: rgba(255,255,255,0.5); }
.empty-desc { font-size: 13px; line-height: 1.6; }

/* ── LOADING ── */
.loading {
  text-align: center;
  padding: 40px;
  color: rgba(255,255,255,0.3);
  font-size: 14px;
}

/* ── ALERT ── */
.alert {
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
}
.alert.error { background: rgba(231,76,60,0.15); border: 1px solid rgba(231,76,60,0.3); color: #ff6b6b; display: block; }
.alert.success { background: rgba(39,174,96,0.15); border: 1px solid rgba(39,174,96,0.3); color: #2ecc71; display: block; }

@media (min-width: 600px) {
  .forum-controls { flex-direction: row; align-items: center; }
  .search-box { flex: 1; }
}
</style>
</head>
<body>

<!-- TOP NAV -->
<div class="topnav">
  <a href="../index.html" class="topnav-logo">Analytica<span>.</span></a>
  <div class="topnav-right">
    <a href="../dashboard/index.html" class="btn-sm btn-outline">Dashboard</a>
    <button class="btn-sm btn-gold" onclick="openModal()">+ Ask</button>
  </div>
</div>

<!-- POST MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Ask the Community</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="alert" id="modal-alert"></div>

    <label>Title — what is your question?</label>
    <input type="text" id="post-title" placeholder="e.g. How do I remove duplicates in SQL?">

    <label>Category</label>
    <select id="post-tag">
      <option value="general">General</option>
      <option value="sql">SQL</option>
      <option value="excel">Excel</option>
      <option value="python">Python</option>
      <option value="powerbi">Power BI</option>
      <option value="career">Career</option>
    </select>

    <label>Details — describe your problem</label>
    <textarea id="post-body" placeholder="Explain your problem in detail. Include any error messages or what you have tried..."></textarea>

    <button class="modal-submit" id="modal-submit" onclick="submitPost()">
      Post Question →
    </button>
  </div>
</div>

<!-- MAIN PAGE -->
<div class="page">

  <div class="page-header">
    <h1 class="page-title">Community <span>Forum</span></h1>
    <p class="page-sub">Ask questions, share knowledge, grow together</p>
  </div>

  <!-- Stats -->
  <div class="forum-stats">
    <div class="fstat">
      <div class="fstat-num" id="total-posts">0</div>
      <div class="fstat-label">Posts</div>
    </div>
    <div class="fstat">
      <div class="fstat-num" id="total-members">0</div>
      <div class="fstat-label">Members</div>
    </div>
    <div class="fstat">
      <div class="fstat-num">24/7</div>
      <div class="fstat-label">Active</div>
    </div>
  </div>

  <!-- Ask button -->
  <div class="ask-btn-wrap">
    <button class="ask-btn" onclick="openModal()">
      ✏️ Ask a Question
    </button>
  </div>

  <!-- Search & Filter -->
  <div class="forum-controls">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Search questions..." oninput="filterPosts()">
    </div>
  </div>

  <!-- Filter tabs -->
  <div class="filter-tabs" style="margin-bottom:20px;">
    <button class="tab active" onclick="setFilter('all', this)">All</button>
    <button class="tab" onclick="setFilter('sql', this)">SQL</button>
    <button class="tab" onclick="setFilter('excel', this)">Excel</button>
    <button class="tab" onclick="setFilter('python', this)">Python</button>
    <button class="tab" onclick="setFilter('powerbi', this)">Power BI</button>
    <button class="tab" onclick="setFilter('career', this)">Career</button>
    <button class="tab" onclick="setFilter('general', this)">General</button>
  </div>

  <!-- Posts -->
  <div class="posts-list" id="posts-list">
    <div class="loading">Loading posts...</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script>
let allPosts = []
let currentFilter = 'all'
let currentUser = null

// ── GET USER ──
async function getUser() {
  const { data: { session } } = await db.auth.getSession()
  if (session) currentUser = session.user
}

// ── LOAD POSTS ──
async function loadPosts() {
  const { data, error } = await db
    .from('forum_posts')
    .select('*')
    .order('created_at', { ascending: false })

  if (error) {
    document.getElementById('posts-list').innerHTML =
      '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Could not load posts</div><div class="empty-desc">Please refresh the page.</div></div>'
    return
  }

  allPosts = data || []
  document.getElementById('total-posts').textContent = allPosts.length
  renderPosts(allPosts)
}

// ── RENDER POSTS ──
function renderPosts(posts) {
  const list = document.getElementById('posts-list')

  if (posts.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🗣️</div>
        <div class="empty-title">No posts yet</div>
        <div class="empty-desc">Be the first to ask a question! The community is waiting to help.</div>
      </div>`
    return
  }

  list.innerHTML = posts.map(post => `
    <a href="post.html?id=${post.id}" class="post-card">
      <div class="post-top">
        <span class="post-tag tag-${post.tag}">${post.tag.toUpperCase()}</span>
        <span class="post-time">${timeAgo(post.created_at)}</span>
      </div>
      <div class="post-title">${escapeHtml(post.title)}</div>
      <div class="post-preview">${escapeHtml(post.body)}</div>
      <div class="post-bottom">
        <div class="post-author">
          <div class="author-avatar">${(post.author_name || 'A')[0].toUpperCase()}</div>
          <span class="author-name">${escapeHtml(post.author_name || 'Anonymous')}</span>
        </div>
        <div class="post-meta">
          <span class="meta-item">👍 ${post.upvotes || 0}</span>
          <span class="meta-item">💬 ${post.replies || 0}</span>
        </div>
      </div>
</a>
  `).join('')

  document.getElementById('total-posts').textContent = allPosts.length
}

// ── FILTER ──
function setFilter(filter, btn) {
  currentFilter = filter
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'))
  btn.classList.add('active')
  filterPosts()
}

function filterPosts() {
  const search = document.getElementById('search-input').value.toLowerCase()
  let filtered = allPosts

  if (currentFilter !== 'all') {
    filtered = filtered.filter(p => p.tag === currentFilter)
  }

  if (search) {
    filtered = filtered.filter(p =>
      p.title.toLowerCase().includes(search) ||
      p.body.toLowerCase().includes(search)
    )
  }

  renderPosts(filtered)
}

// ── MODAL ──
function openModal() {
  if (!currentUser) {
    window.location.href = '../auth/login.html'
    return
  }
  document.getElementById('modal-overlay').classList.add('show')
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show')
  document.getElementById('modal-alert').className = 'alert'
  document.getElementById('post-title').value = ''
  document.getElementById('post-body').value = ''
}

// ── SUBMIT POST ──
async function submitPost() {
  const title = document.getElementById('post-title').value.trim()
  const body  = document.getElementById('post-body').value.trim()
  const tag   = document.getElementById('post-tag').value
  const alertBox = document.getElementById('modal-alert')
  const btn = document.getElementById('modal-submit')

  if (!title) {
    alertBox.textContent = 'Please enter a title for your question.'
    alertBox.className = 'alert error'
    return
  }

  if (!body) {
    alertBox.textContent = 'Please describe your problem in detail.'
    alertBox.className = 'alert error'
    return
  }

  btn.disabled = true
  btn.textContent = 'Posting...'

  const meta = currentUser.user_metadata
  const authorName = meta.full_name || meta.first_name || currentUser.email.split('@')[0]

  const { error } = await db.from('forum_posts').insert({
    title,
    body,
    tag,
    author_id: currentUser.id,
    author_name: authorName,
    upvotes: 0,
    replies: 0
  })

  if (error) {
    alertBox.textContent = 'Failed to post. Please try again.'
    alertBox.className = 'alert error'
    btn.disabled = false
    btn.textContent = 'Post Question →'
    return
  }

  alertBox.textContent = 'Question posted successfully!'
  alertBox.className = 'alert success'
  btn.textContent = 'Posted ✓'

  setTimeout(() => {
    closeModal()
    loadPosts()
    btn.disabled = false
    btn.textContent = 'Post Question →'
  }, 1500)
}

// ── HELPERS ──
function timeAgo(dateStr) {
  const diff = Math.floor((Date.now() - new Date(dateStr)) / 1000)
  if (diff < 60) return 'just now'
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`
  return `${Math.floor(diff/86400)}d ago`
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
}

// ── INIT ──
async function init() {
  await getUser()
  loadPosts()
}
init()
</script>
</body>
</html>
