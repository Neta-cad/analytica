<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post — Analytica Community</title>
<link rel="stylesheet" href="../css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { background: #0A1628; min-height: 100vh; }

.topnav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 60px;
  background: rgba(10,22,40,0.95);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 40;
}
.topnav-logo {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  font-weight: 900;
  color: #fff;
  text-decoration: none;
}
.topnav-logo span { color: #F5A623; }
.back-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  color: rgba(255,255,255,0.6);
  font-size: 14px;
  text-decoration: none;
  transition: color 0.2s;
}
.back-btn:hover { color: #F5A623; }

.page {
  margin-top: 60px;
  padding: 28px 20px;
  max-width: 800px;
  margin-left: auto;
  margin-right: auto;
}

/* ── POST CARD ── */
.post-full {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
}
.post-tag {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid;
  margin-bottom: 14px;
}
.tag-sql { background: rgba(52,152,219,0.1); color: #3498db; border-color: rgba(52,152,219,0.3); }
.tag-excel { background: rgba(39,174,96,0.1); color: #27AE60; border-color: rgba(39,174,96,0.3); }
.tag-python { background: rgba(155,89,182,0.1); color: #9b59b6; border-color: rgba(155,89,182,0.3); }
.tag-powerbi { background: rgba(245,166,35,0.1); color: #F5A623; border-color: rgba(245,166,35,0.3); }
.tag-general { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5); border-color: rgba(255,255,255,0.1); }
.tag-career { background: rgba(231,76,60,0.1); color: #e74c3c; border-color: rgba(231,76,60,0.3); }

.post-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(20px, 4vw, 28px);
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 16px;
}
.post-body {
  font-size: 15px;
  color: rgba(255,255,255,0.7);
  line-height: 1.8;
  margin-bottom: 20px;
  white-space: pre-wrap;
}
.post-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 16px;
  border-top: 1px solid rgba(255,255,255,0.06);
  flex-wrap: wrap;
  gap: 12px;
}
.post-author {
  display: flex;
  align-items: center;
  gap: 10px;
}
.author-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, #F5A623, #e8920f);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: #0A1628;
}
.author-info {}
.author-name { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.8); }
.post-time { font-size: 11px; color: rgba(255,255,255,0.3); }

.upvote-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: rgba(245,166,35,0.1);
  border: 1px solid rgba(245,166,35,0.2);
  border-radius: 100px;
  color: #F5A623;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  transition: all 0.2s;
}
.upvote-btn:hover { background: rgba(245,166,35,0.2); }
.upvote-btn.voted { background: rgba(245,166,35,0.25); border-color: #F5A623; }

/* ── COMMENTS ── */
.comments-section { margin-bottom: 24px; }

.comments-header {
  font-size: 16px;
  font-weight: 600;
  color: rgba(255,255,255,0.8);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.comments-list { display: flex; flex-direction: column; gap: 12px; }

.comment-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
  padding: 16px;
  transition: all 0.2s;
}
.comment-card:hover { border-color: rgba(255,255,255,0.1); }
.comment-card.best-answer {
  background: rgba(39,174,96,0.06);
  border-color: rgba(39,174,96,0.25);
}

.best-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(39,174,96,0.15);
  color: #27AE60;
  border: 1px solid rgba(39,174,96,0.3);
  padding: 3px 10px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 10px;
}

.comment-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.comment-author {
  display: flex;
  align-items: center;
  gap: 8px;
}
.comment-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, #1a3a6b, #3498db);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
}
.comment-name { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.7); }
.comment-time { font-size: 11px; color: rgba(255,255,255,0.3); }
.comment-body {
  font-size: 14px;
  color: rgba(255,255,255,0.6);
  line-height: 1.7;
  white-space: pre-wrap;
}
.comment-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 12px;
}
.comment-upvote {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: rgba(255,255,255,0.35);
  cursor: pointer;
  background: none;
  border: none;
  font-family: 'DM Sans', sans-serif;
  transition: color 0.2s;
}
.comment-upvote:hover { color: #F5A623; }
.mark-best {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: rgba(255,255,255,0.35);
  cursor: pointer;
  background: none;
  border: none;
  font-family: 'DM Sans', sans-serif;
  transition: color 0.2s;
}
.mark-best:hover { color: #27AE60; }

/* ── REPLY BOX ── */
.reply-box {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 20px;
}
.reply-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 14px;
  color: rgba(255,255,255,0.8);
}
.reply-input {
  width: 100%;
  padding: 14px 16px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  color: #fff;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  outline: none;
  resize: vertical;
  min-height: 100px;
  transition: border-color 0.2s;
  margin-bottom: 12px;
}
.reply-input:focus { border-color: #F5A623; }
.reply-input::placeholder { color: rgba(255,255,255,0.25); }
.reply-submit {
  padding: 12px 24px;
  background: #F5A623;
  border: none;
  border-radius: 8px;
  color: #0A1628;
  font-size: 14px;
  font-weight: 700;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
}
.reply-submit:hover { background: #FFD07A; }
.reply-submit:disabled { opacity: 0.6; cursor: not-allowed; }

.login-prompt {
  text-align: center;
  padding: 20px;
  color: rgba(255,255,255,0.4);
  font-size: 14px;
}
.login-prompt a { color: #F5A623; font-weight: 600; }

/* ── LOADING / EMPTY ── */
.loading { text-align: center; padding: 40px; color: rgba(255,255,255,0.3); }
.empty-comments {
  text-align: center;
  padding: 32px;
  color: rgba(255,255,255,0.3);
  font-size: 14px;
}

.alert {
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 14px;
  display: none;
}
.alert.error { background: rgba(231,76,60,0.15); border: 1px solid rgba(231,76,60,0.3); color: #ff6b6b; display: block; }
.alert.success { background: rgba(39,174,96,0.15); border: 1px solid rgba(39,174,96,0.3); color: #2ecc71; display: block; }
</style>
</head>
<body>

<div class="topnav">
  <a href="index.html" class="back-btn">← Forum</a>
  <a href="../index.html" class="topnav-logo">Analytica<span>.</span></a>
</div>

<div class="page">

  <!-- Post -->
  <div id="post-container">
    <div class="loading">Loading post...</div>
  </div>

  <!-- Comments -->
  <div class="comments-section">
    <div class="comments-header">
      💬 <span id="comments-count">0</span> Replies
    </div>
    <div class="comments-list" id="comments-list">
      <div class="loading">Loading replies...</div>
    </div>
  </div>

  <!-- Reply Box -->
  <div class="reply-box" id="reply-box">
    <div class="reply-title">✏️ Write a Reply</div>
    <div class="alert" id="reply-alert"></div>
    <textarea
      class="reply-input"
      id="reply-input"
      placeholder="Share your answer or thoughts...">
    </textarea>
    <button class="reply-submit" id="reply-submit" onclick="submitReply()">
      Post Reply →
    </button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script>
let currentUser = null
let currentPost = null
let postId = null

// ── GET POST ID FROM URL ──
function getPostId() {
  const params = new URLSearchParams(window.location.search)
  return params.get('id')
}

// ── GET USER ──
async function getUser() {
  const { data: { session } } = await db.auth.getSession()
  if (session) currentUser = session.user

  if (!currentUser) {
    document.getElementById('reply-box').innerHTML = `
      <div class="login-prompt">
        <a href="../auth/login.html">Log in</a> to write a reply
      </div>`
  }
}

// ── LOAD POST ──
async function loadPost() {
  const { data, error } = await db
    .from('forum_posts')
    .select('*')
    .eq('id', postId)
    .single()

  if (error || !data) {
    document.getElementById('post-container').innerHTML =
      '<div class="loading">Post not found.</div>'
    return
  }

  currentPost = data

  document.title = `${data.title} — Analytica`

  document.getElementById('post-container').innerHTML = `
    <div class="post-full">
      <span class="post-tag tag-${data.tag}">${data.tag.toUpperCase()}</span>
      <div class="post-title">${escapeHtml(data.title)}</div>
      <div class="post-body">${escapeHtml(data.body)}</div>
      <div class="post-footer">
        <div class="post-author">
          <div class="author-avatar">${(data.author_name || 'A')[0].toUpperCase()}</div>
          <div class="author-info">
            <div class="author-name">${escapeHtml(data.author_name || 'Anonymous')}</div>
            <div class="post-time">${timeAgo(data.created_at)}</div>
          </div>
        </div>
        <button class="upvote-btn" id="upvote-btn" onclick="upvotePost()">
          👍 <span id="upvote-count">${data.upvotes || 0}</span>
        </button>
      </div>
    </div>
  `
}

// ── LOAD COMMENTS ──
async function loadComments() {
  const { data, error } = await db
    .from('forum_comments')
    .select('*')
    .eq('post_id', postId)
    .order('created_at', { ascending: true })

  if (error) {
    document.getElementById('comments-list').innerHTML =
      '<div class="empty-comments">Could not load replies.</div>'
    return
  }

  const comments = data || []
  document.getElementById('comments-count').textContent = comments.length

  if (comments.length === 0) {
    document.getElementById('comments-list').innerHTML =
      '<div class="empty-comments">No replies yet. Be the first to answer!</div>'
    return
  }

  document.getElementById('comments-list').innerHTML = comments.map(c => `
    <div class="comment-card ${c.is_best_answer ? 'best-answer' : ''}" id="comment-${c.id}">
      ${c.is_best_answer ? '<div class="best-badge">✅ Best Answer</div>' : ''}
      <div class="comment-top">
        <div class="comment-author">
          <div class="comment-avatar">${(c.author_name || 'A')[0].toUpperCase()}</div>
          <span class="comment-name">${escapeHtml(c.author_name || 'Anonymous')}</span>
        </div>
        <span class="comment-time">${timeAgo(c.created_at)}</span>
      </div>
      <div class="comment-body">${escapeHtml(c.body)}</div>
      <div class="comment-actions">
        <button class="comment-upvote" onclick="upvoteComment('${c.id}', ${c.upvotes || 0})">
          👍 <span id="cupvote-${c.id}">${c.upvotes || 0}</span>
        </button>
        ${currentUser && currentPost && currentUser.id === currentPost.author_id && !c.is_best_answer ? `
          <button class="mark-best" onclick="markBestAnswer('${c.id}')">
            ✅ Mark as Best Answer
          </button>
        ` : ''}
      </div>
    </div>
  `).join('')
}

// ── UPVOTE POST ──
async function upvotePost() {
  if (!currentUser) {
    window.location.href = '../auth/login.html'
    return
  }
  const newCount = (currentPost.upvotes || 0) + 1
  await db.from('forum_posts').update({ upvotes: newCount }).eq('id', postId)
  document.getElementById('upvote-count').textContent = newCount
  document.getElementById('upvote-btn').classList.add('voted')
  currentPost.upvotes = newCount
}

// ── UPVOTE COMMENT ──
async function upvoteComment(commentId, currentUpvotes) {
  if (!currentUser) {
    window.location.href = '../auth/login.html'
    return
  }
  const newCount = currentUpvotes + 1
  await db.from('forum_comments').update({ upvotes: newCount }).eq('id', commentId)
  document.getElementById(`cupvote-${commentId}`).textContent = newCount
}

// ── MARK BEST ANSWER ──
async function markBestAnswer(commentId) {
  await db.from('forum_comments')
    .update({ is_best_answer: true })
    .eq('id', commentId)
  loadComments()
}

// ── SUBMIT REPLY ──
async function submitReply() {
  const body = document.getElementById('reply-input').value.trim()
  const alertBox = document.getElementById('reply-alert')
  const btn = document.getElementById('reply-submit')

  if (!body) {
    alertBox.textContent = 'Please write a reply first.'
    alertBox.className = 'alert error'
    return
  }

  btn.disabled = true
  btn.textContent = 'Posting...'

  const meta = currentUser.user_metadata
  const authorName = meta.full_name || meta.first_name || currentUser.email.split('@')[0]

  const { error } = await db.from('forum_comments').insert({
    post_id: postId,
    body,
    author_id: currentUser.id,
    author_name: authorName,
    upvotes: 0,
    is_best_answer: false
  })

  if (error) {
    alertBox.textContent = 'Failed to post reply. Please try again.'
    alertBox.className = 'alert error'
    btn.disabled = false
    btn.textContent = 'Post Reply →'
    return
  }

  alertBox.textContent = 'Reply posted!'
  alertBox.className = 'alert success'
  document.getElementById('reply-input').value = ''
  btn.textContent = 'Posted ✓'

  setTimeout(() => {
    alertBox.className = 'alert'
    btn.disabled = false
    btn.textContent = 'Post Reply →'
    loadComments()

    // Update reply count on post
    const newReplies = (currentPost.replies || 0) + 1
    db.from('forum_posts').update({ replies: newReplies }).eq('id', postId)
  }, 1000)
}

// ── HELPERS ──
function timeAgo(dateStr) {
  const diff = Math.floor((Date.now() - new Date(dateStr)) / 1000)
  if (diff < 60) return 'just now'
  if (diff < 3600) return `${Math.floor(diff/60)}m ago`
  if (diff < 86400) return `${Math.floor(diff/3600)}h ago`
  return `${Math.floor(diff/86400)}d ago`
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
}

// ── INIT ──
postId = getPostId()
if (!postId) {
  window.location.href = 'index.html'
} else {
  getUser().then(() => {
    loadPost()
    loadComments()
  })
}
</script>
</body>
</html>
