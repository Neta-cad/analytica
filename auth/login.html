<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Analytica</title>
<link rel="stylesheet" href="../css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: #0A1628;
  position: relative;
  overflow: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(245,166,35,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(245,166,35,0.04) 1px, transparent 1px);
  background-size: 50px 50px;
  pointer-events: none;
}
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(70px);
  pointer-events: none;
}
.orb-1 { width:300px; height:300px; background:rgba(245,166,35,0.08); top:-80px; left:-80px; }
.orb-2 { width:250px; height:250px; background:rgba(26,58,107,0.5); bottom:-60px; right:-60px; }
.auth-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 40px 32px;
  width: 100%;
  max-width: 420px;
  position: relative;
  z-index: 2;
}
.auth-logo {
  font-family: 'Playfair Display', serif;
  font-size: 24px;
  font-weight: 900;
  color: #fff;
  text-align: center;
  margin-bottom: 8px;
  display: block;
  text-decoration: none;
}
.auth-logo span { color: #F5A623; }
.auth-tagline {
  text-align: center;
  font-size: 13px;
  color: rgba(255,255,255,0.4);
  margin-bottom: 32px;
}
.auth-title {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 6px;
}
.auth-sub {
  text-align: center;
  font-size: 13px;
  color: rgba(255,255,255,0.45);
  margin-bottom: 28px;
}
.form-group { margin-bottom: 18px; }
label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,0.7);
  margin-bottom: 7px;
}
.label-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 7px;
}
.label-row a { font-size: 12px; color: #F5A623; text-decoration: none; }
input {
  width: 100%;
  padding: 12px 16px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  outline: none;
  transition: border-color 0.2s;
}
input:focus { border-color: #F5A623; background: rgba(255,255,255,0.08); }
input::placeholder { color: rgba(255,255,255,0.25); }
.btn-submit {
  width: 100%;
  padding: 14px;
  background: #F5A623;
  border: none;
  border-radius: 8px;
  color: #0A1628;
  font-size: 15px;
  font-weight: 700;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 8px;
}
.btn-submit:hover { background: #FFD07A; transform: translateY(-1px); }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 20px 0;
}
.divider-line { flex: 1; height: 1px; background: rgba(255,255,255,0.08); }
.divider-text { font-size: 12px; color: rgba(255,255,255,0.3); }
.btn-google {
  width: 100%;
  padding: 13px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 8px;
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
  display: none;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.signup-link {
  text-align: center;
  font-size: 13px;
  color: rgba(255,255,255,0.45);
  margin-top: 20px;
}
.signup-link a { color: #F5A623; font-weight: 600; }
.alert {
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 18px;
  display: none;
}
.alert.error { background: rgba(231,76,60,0.15); border: 1px solid rgba(231,76,60,0.3); color: #ff6b6b; display: block; }
.alert.success { background: rgba(39,174,96,0.15); border: 1px solid rgba(39,174,96,0.3); color: #2ecc71; display: block; }
.welcome-badge {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(39,174,96,0.1);
  border: 1px solid rgba(39,174,96,0.2);
  border-radius: 10px;
  padding: 12px 16px;
  margin-bottom: 24px;
  font-size: 13px;
  color: rgba(255,255,255,0.6);
}
.welcome-badge span { font-size: 20px; }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="auth-card">
  <a href="../index.html" class="auth-logo">Analytica<span>.</span></a>
  <p class="auth-tagline">Where Tech People Connect & Build</p>

  <div class="welcome-badge">
    <span id="welcome-icon">🚀</span>
    <div id="welcome-text">Ready to join Africa's data community?</div>
  </div>

  <h1 class="auth-title">Log In</h1>
  <p class="auth-sub">Good to have you back</p>

  <div class="alert" id="alert"></div>

  <form id="login-form">
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>
    <div class="form-group">
      <div class="label-row">
        <label for="password">Password</label>
        <a href="reset.html">Forgot password?</a>
      </div>
      <input type="password" id="password" placeholder="Your password" required>
    </div>
    <button type="submit" class="btn-submit" id="submit-btn">Log In →</button>
  </form>

  <p class="signup-link">
    Don't have an account? <a href="signup.html">Sign Up Free</a>
  </p>
</div>


<script src="../js/supabase.js"></script>
<script>
// ── SMART WELCOME MESSAGE ──
const visited = localStorage.getItem('analytica_visited')
if (visited) {
  document.getElementById('welcome-icon').textContent = '👋'
  document.getElementById('welcome-text').textContent = 'Welcome back! Your datasets and tools are waiting.'
} else {
  document.getElementById('welcome-icon').textContent = '🚀'
  document.getElementById('welcome-text').textContent = 'Ready to join Africa\'s data community?'
}

// ── LOGIN FORM ──
const form = document.getElementById('login-form')
const alertBox = document.getElementById('alert')
const submitBtn = document.getElementById('submit-btn')

function showAlert(message, type) {
  alertBox.textContent = message
  alertBox.className = 'alert ' + type
}

form.addEventListener('submit', async (e) => {
  e.preventDefault()
  const email = document.getElementById('email').value.trim()
  const password = document.getElementById('password').value

  submitBtn.disabled = true
  submitBtn.textContent = 'Logging in...'

  const { data, error } = await db.auth.signInWithPassword({ email, password })

  if (error) {
    showAlert('Incorrect email or password. Please try again.', 'error')
    submitBtn.disabled = false
    submitBtn.textContent = 'Log In →'
    return
  }

  showAlert('Login successful! Redirecting...', 'success')
  submitBtn.textContent = 'Welcome back ✓'
  localStorage.setItem('analytica_visited', 'true')

  setTimeout(() => {
    window.location.href = '/dashboard/index.html'
  }, 1500)
})
</script>

</body>
</html>
